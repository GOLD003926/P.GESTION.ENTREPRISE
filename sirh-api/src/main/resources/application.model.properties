spring.application.name=sirh-api
server.port=8080

# ---------- Base de données ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/sirh_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# Flyway gère le schéma, Hibernate vérifie seulement qu'il correspond aux entités
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
# Pour déboguer les requêtes, décommente :
# logging.level.org.hibernate.SQL=debug

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Upload des documents (CV, contrats, PDF) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
sirh.storage.location=./uploads

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---------- Sécurité JWT (HS256) ----------
# Le secret doit faire au moins 32 caractères. À surcharger via variable d'environnement.
sirh.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-32chars-min}
sirh.jwt.expiration-minutes=120

# ---------- CORS (front Vue en dev, port Vite par défaut) ----------
sirh.cors.allowed-origins=http://localhost:5173

# ---------- Paramètres métier ----------
sirh.demande.delai-min-embauche-jours=30
sirh.demande.duree-budget-mois=12
sirh.demande.coef-charges=0.20
sirh.proposition.delai-reponse-jours=7
sirh.proposition.duree-prolongation-jours=3
sirh.contrat.essai.duree-max-mois=6
sirh.contrat.essai.cumul-max-mois=12
sirh.contrat.cdd.duree-max-mois=24
sirh.contrat.alerte-fin-jours=30
sirh.candidat.conservation-mois=24
sirh.employe.matricule-prefixe=EMP
# ---------- Langue (messages de validation en français) ----------
spring.web.locale=fr
spring.web.locale-resolver=fixed

# ---------- Administrateur initial (créé au démarrage si aucun admin n'existe) ----------
sirh.admin.email=admin@sirh.local
sirh.admin.password=Admin@12345
sirh.admin.nom=Administrateur
sirh.admin.prenom=SIRH

springdoc.swagger-ui.persist-authorization=true

# ---------- Pagination (valable pour tous les modules) ----------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
